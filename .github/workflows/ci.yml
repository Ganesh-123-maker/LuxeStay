name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: |
          for f in $(find . -path ./node_modules -prune -o -name '*.js' -print | grep -v node_modules); do node --check "$f"; done
